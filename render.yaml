services:
  - type: web
    name: saysafe
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CREDENTIALS   # "CLIENT_ID:SECRET" (or set PAYPAL_CLIENT_ID + PAYPAL_CLIENT_SECRET)
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: INSIGHTS_DASHBOARD   # public deployment stays on the native dashboard (AG Studio trial is evaluation-only)
        value: native
      - key: VITE_AG_STUDIO_LICENSE   # leave unset in production until AG Grid grants written permission
        sync: false
      # Persistent database: Turso free plan (see docs/DATABASE.md). Startup fails in production without it.
      - key: TURSO_DATABASE_URL
        value: libsql://saysafe-saysafe-lp.aws-eu-west-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
